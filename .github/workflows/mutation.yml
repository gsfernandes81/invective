name: mutation

# invective on its own code: every module broken one edit at a time, every
# kind of edit, against the tests that cover it, through `pytest --mutate`.
# One Python on Linux, because a verdict comes from the code and its tests and
# nothing in invective differs by version or platform in what is mutated; one
# job per module, so the modules run at once.

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'uv.lock',
            '.github/workflows/mutation.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'uv.lock',
            '.github/workflows/mutation.yml']
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  module:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    # An entry's own `timeout` (minutes) where its campaign is longer.
    timeout-minutes: ${{ matrix.timeout || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # tests/test_settings.py is in no job: it runs whole campaigns,
          # about a minute for each mutant. Nor is tests/test_own_code.py:
          # it reads the module mutated, so every accepted constant's mutant
          # would fail it.
          # The gate's checks are with the acceptances', and the link
          # refusals with the copy's.
          # The engine is the largest campaign: about 300 mutants against
          # four test files, a minute a survivor, and about one in eight a
          # mutant that hangs and runs out its budget, three times the
          # baseline. `auto` runs one mutant for each of the runner's CPUs
          # (four on ubuntu-latest), and the suite is safe to run in
          # parallel, as `-n auto` runs it; even so, the campaign takes
          # about an hour.
          - module: src/invective/mutate.py
            tests: tests/test_mutate.py tests/test_workers.py tests/test_accept.py tests/test_tree.py tests/test_coverage_selection.py
            options: --mutate-workers auto
            timeout: 120
          # The map's reading, and the engine's use of it.
          - module: src/invective/covers.py
            tests: tests/test_covers.py tests/test_coverage_selection.py
          - module: src/invective/sweep.py
            tests: tests/test_sweep.py
          - module: src/invective/__main__.py
            tests: tests/test_cli.py
          - module: src/invective/accept.py
            tests: tests/test_accept.py
          - module: src/invective/config.py
            tests: tests/test_accept.py
          # The git tests are the engine's: a run on a ref.
          - module: src/invective/tree.py
            tests: tests/test_tree.py tests/test_mutate.py tests/test_workers.py
          # Its tests are its callers': a run, a ref's git, and the sweep.
          - module: src/invective/process.py
            tests: tests/test_mutate.py tests/test_tree.py tests/test_sweep.py
          # Its tests start pytest rather than import it, so no sweep of
          # imports would pair them. The coverage run's recorder is the
          # plugin's, and its map's tests are the coverage tests.
          - module: src/pytest_invective/__init__.py
            tests: tests/test_plugin.py tests/test_covers.py
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.10.11'

      - name: Install
        run: uv sync --locked --python 3.14

      # `-n 0`: the project's addopts turns xdist's workers on, and --mutate
      # refuses them. Survivors are a finding to read, not a failure: the job
      # fails only when the run could not be trusted. `shell: bash` is what
      # turns on pipefail, without which `tee` would have the last word.
      - name: Mutate
        shell: bash
        run: >-
          uv run --no-sync pytest -n 0 -p no:cacheprovider
          --mutate ${{ matrix.module }}
          --mutate-only CMP,BOOL,NOT,CONST,RAISE ${{ matrix.options }}
          --mutate-json mutants.json ${{ matrix.tests }}
          | tee mutate.log

      - name: Survivors
        if: always()
        run: |
          {
            echo "### ${{ matrix.module }}"
            echo '```'
            grep -E "SURVIVED|killed \(|refused:" mutate.log || echo "(no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ strategy.job-index }}
          path: mutants.json
          if-no-files-found: ignore
