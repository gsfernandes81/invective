name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every Python that has not reached its end of life. Windows is here
        # because the engine writes and stamps source files and kills process
        # trees, and those are where the two platforms differ.
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        resolution: [locked]
        include:
          # The oldest pytest and pytest-xdist the project allows. pytest
          # before 8.4 loads plugins before a repository's `pythonpath`,
          # which is why the plugin is a package of its own.
          - os: ubuntu-latest
            python: '3.11'
            resolution: lowest-direct
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # The line whose bundled build backend `pyproject.toml` bounds.
          version: '0.10.11'

      - name: Install
        if: matrix.resolution == 'locked'
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Install the oldest versions allowed
        if: matrix.resolution == 'lowest-direct'
        run: uv sync --resolution lowest-direct --python ${{ matrix.python }}

      - name: Test
        run: uv run --no-sync pytest
