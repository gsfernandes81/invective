# The 0.10 bound is the backend line `uv==0.10.11` bundles, so a build with
# that uv needs nothing downloaded.
[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[project]
name = "invective"
version = "0.5.1"
description = "Mutation testing for a pytest suite: break one function at a time and report every edit the tests let through"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# 3.12 is the first with `sys.monitoring`, which maps each test to the
# lines it ran.
requires-python = ">=3.12"
# The engine lives inside the pytest session the user started, so pytest is
# the one runtime dependency. 8.2 is the oldest the checks run against (the
# `lowest-direct` leg of `checks`).
dependencies = ["pytest>=8.2"]

[project.entry-points.pytest11]
invective = "invective.plugin"

# For invective's own suite: pytest-xdist runs it on workers. The engine's
# children never do. ruff and ty are pinned because the findings they report
# change between releases, and `checks` must agree with a local run.
[dependency-groups]
dev = ["pytest-xdist>=3.8.0", "ruff==0.17.1", "ty==0.0.89"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The fixture projects under tests/projects run through a pytest of their
# own, started by the `project` fixture; collected here they would fail.
norecursedirs = ["tests/projects"]
addopts = "-n auto"

# `ty check src tests`, the fixture projects under tests/projects included.
[tool.ty.environment]
# Each fixture project's tests import its package from its own `src`, which pytest
# puts on the path from the project's `pythonpath`.
extra-paths = [
    "tests/projects/basic/src",
    "tests/projects/bp/src",
    "tests/projects/doctests/src",
    "tests/projects/dup/src",
    "tests/projects/early/src",
    "tests/projects/edited/src",
    "tests/projects/fin2/src",
    "tests/projects/finalizer/src",
    "tests/projects/finmod/src",
    "tests/projects/fixtures/src",
    "tests/projects/forks/src",
    "tests/projects/gccycle/src",
    "tests/projects/hardexit/src",
    "tests/projects/hostile/src",
    "tests/projects/ihook/src",
    "tests/projects/inpk/src",
    "tests/projects/lazy/src",
    "tests/projects/lazy2/src",
    "tests/projects/ns/src",
    "tests/projects/options/src",
    "tests/projects/ordered/src",
    "tests/projects/par/src",
    "tests/projects/propimp/src",
    "tests/projects/recordprop/src",
    "tests/projects/red/src",
    "tests/projects/ro/src",
    "tests/projects/runpath/src",
    "tests/projects/shadow/src",
    "tests/projects/state/src",
    "tests/projects/sym/src",
    "tests/projects/taskgroup/src",
    "tests/projects/threads/src",
    "tests/projects/untouched/src",
]

[tool.ty.terminal]
# A warning fails the check as an error does.
error-on-warning = true

# Rules ty leaves off by default, turned on. Each finds a fault in code that runs.
[tool.ty.rules]
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
division-by-zero = "error"
# A suppression names the rule it suppresses, so it cannot hide a second fault.
blanket-ignore-comment = "error"
