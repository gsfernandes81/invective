# The 0.10 bound is the backend line `uv==0.10.11` bundles, so a build with
# that uv needs nothing downloaded.
[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[project]
name = "invective"
version = "0.1.0"
description = "Mutation testing for a pytest suite: break one line at a time and report every edit the tests let through"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The engine runs `python -m pytest` with the interpreter it was started by,
# so pytest has to be importable wherever invective is. 8.2 is the oldest
# the checks are run against (the `lowest-direct` leg of `checks`).
# iniconfig is pytest's own reader of `.ini` and `.cfg` files, and invective
# reads them with it so that one reads as pytest reads it; pytest depends on
# it, and invective imports it, so it is named here too.
dependencies = ["pytest>=8.2", "iniconfig>=2"]

[project.scripts]
invective = "invective.__main__:main"

# Named as the module is, so that `-p pytest_invective` on a command line and
# this entry point are one plugin to pytest, not two registrations of it.
[project.entry-points.pytest11]
pytest_invective = "pytest_invective"

# The plugin is a package of its own, beside `invective` rather than inside
# it: see `pytest_invective`'s docstring for why it must not import it.
[tool.uv.build-backend]
module-name = ["invective", "pytest_invective"]

# For invective's own suite: pytest-xdist runs it on workers, and the plugin
# and the engine both have to cope with a repository that does.
[dependency-groups]
dev = ["pytest-xdist>=3.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` goes on the path in `tests/conftest.py`, not with `pythonpath` here.
# Workers by default: nearly every check here starts a process, and they wait
# side by side. invective's own runs of a mutant are `-n 0`, and `--mutate`
# here has to be given `-n 0` too.
addopts = "-n auto"
