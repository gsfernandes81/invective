# The 0.10 bound is the backend line `uv==0.10.11` bundles, so a build with
# that uv needs nothing downloaded.
[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[project]
name = "invective"
version = "0.5.1"
description = "Mutation testing for a pytest suite: break one function at a time and report every edit the tests let through"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# 3.12 is the first with `sys.monitoring`, which maps each test to the
# lines it ran.
requires-python = ">=3.12"
# The engine lives inside the pytest session the user started, so pytest is
# the one runtime dependency. 8.2 is the oldest the checks run against (the
# `lowest-direct` leg of `checks`).
dependencies = ["pytest>=8.2"]

[project.entry-points.pytest11]
invective = "invective.plugin"

# For invective's own suite: pytest-xdist runs it on workers. The engine's
# children never do.
[dependency-groups]
dev = ["pytest-xdist>=3.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The fixture projects under tests/projects run through a pytest of their
# own, started by the `project` fixture; collected here they would fail.
norecursedirs = ["tests/projects"]
addopts = "-n auto"
